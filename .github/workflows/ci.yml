name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    name: Test, security and integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff pytest-cov pip-audit

      - name: Compile
        run: python -m compileall -q app simulator

      - name: Lint critical errors
        run: ruff check app simulator tests --select E9,F63,F7,F82

      - name: Run tests with coverage
        env:
          PYTHONPATH: .
          DATABASE_URL: sqlite:///./industrial_ci.db
          MQTT_ENABLED: "false"
        run: python -m pytest -q --cov=app --cov-report=term-missing

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Build application image
        run: docker build -t industrial-iot-monitoring:${{ github.sha }} .

      - name: Scan application image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: industrial-iot-monitoring:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true

      - name: Start complete stack
        run: docker compose up -d --build

      - name: Wait for API
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/health; then
              exit 0
            fi
            sleep 3
          done
          docker compose ps
          exit 1

      - name: Validate metrics endpoint
        run: |
          curl --fail --silent http://127.0.0.1:8000/metrics | grep industrial_http_requests_total

      - name: Wait for Prometheus
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9090/-/ready; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Verify Prometheus target
        run: |
          for i in {1..20}; do
            response="$(curl --fail --silent 'http://127.0.0.1:9090/api/v1/query?query=up%7Bjob%3D%22industrial-api%22%7D')"
            if echo "$response" | grep -q '"value":\[[^]]*,"1"\]'; then
              exit 0
            fi
            sleep 2
          done
          echo "$response"
          exit 1

      - name: Wait for Grafana
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health | grep -q '"database"'; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Show stack status
        if: always()
        run: docker compose ps

      - name: Show stack logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Stop stack
        if: always()
        run: docker compose down -v
