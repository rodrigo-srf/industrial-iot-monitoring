name: CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff pytest-cov

      - name: Compile
        run: python -m compileall -q app simulator

      - name: Lint critical errors
        run: ruff check app simulator tests --select E9,F63,F7,F82

      - name: Run tests
        env:
          DATABASE_URL: sqlite:///./industrial_ci.db
          MQTT_ENABLED: "false"
        run: pytest -q --cov=app --cov-report=term-missing

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Build application image
        run: docker build -t industrial-iot-monitoring:${{ github.sha }} .
